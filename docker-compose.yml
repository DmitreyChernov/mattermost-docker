services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=MattermostSecurePass2026!
      - POSTGRES_DB=mattermost
      - TZ=UTC

  app:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - app_config:/mattermost/config:rw
      - app_data:/mattermost/data:rw
      - app_logs:/mattermost/logs:rw
      - app_plugins:/mattermost/plugins:rw
      - app_client_plugins:/mattermost/client/plugins:rw
    environment:
      - MM_USERNAME=mmuser
      - MM_PASSWORD=MattermostSecurePass2026!
      - MM_DBNAME=mattermost
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:MattermostSecurePass2026!@db:5432/mattermost?sslmode=disable&connect_timeout=10
      
      # ВАЖНО: Домен БЕЗ порта. 
      # Мы надеемся, что внешний прокси Timeweb пробросит запрос на 8443, 
      # и Mattermost увидит правильный Host.
      - MM_SERVICESETTINGS_SITEURL=https://mattermost.rechex.ru
      
      - MM_SERVICESETTINGS_ENABLEMOBILEAPP=true
      - MM_SERVICESETTINGS_ENABLEMOBILEPUSHPROXY=true

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Используем нестандартный порт 8443 вместо 443
      - "8443:8443"
    volumes:
      - cert_data:/cert:rw
    environment:
      - DOMAIN=mattermost.rechex.ru
      - APP_HOST=app
      - APP_PORT_NUMBER=8065

volumes:
  db_data:
  app_config:
  app_data:
  app_logs:
  app_plugins:
  app_client_plugins:
  cert_data:
