services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    networks:
      - mattermost-network # <-- Подключаем к сети

  app:
    image: mattermost/mattermost-team-edition:${MATTERMOST_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - app_config:/mattermost/config:rw
      - app_data:/mattermost/data:rw
      - app_logs:/mattermost/logs:rw
      - app_plugins:/mattermost/plugins:rw
      - app_client_plugins:/mattermost/client/plugins:rw
    environment:
      - MM_USERNAME=${POSTGRES_USER}
      - MM_PASSWORD=${POSTGRES_PASSWORD}
      - MM_DBNAME=${POSTGRES_DB}
      # Хост 'db' должен совпадать с именем сервиса выше
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10
      
      - MM_SERVICESETTINGS_SITEURL=https://${DOMAIN}
      - MM_SERVICESETTINGS_ENABLEMOBILEAPP=true
      - MM_SERVICESETTINGS_ENABLEMOBILEPUSHPROXY=true
    networks:
      - mattermost-network # <-- Подключаем к сети

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "443"
      - "80"
    volumes:
      - cert_data:/cert:rw
    environment:
      - DOMAIN=${DOMAIN}
      - APP_HOST=app
      - APP_PORT_NUMBER=8065
    networks:
      - mattermost-network # <-- Подключаем к сети

volumes:
  db_data:
  app_config:
  app_data:
  app_logs:
  app_plugins:
  app_client_plugins:
  cert_data:

# Явное определение сети (это решает ошибку 'no such host')
networks:
  mattermost-network:
    driver: bridge
