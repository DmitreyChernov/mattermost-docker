version: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Используем именованный том вместо пути к хосту (нет доступа к mkdir)
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC

  app:
    image: mattermost/mattermost-team-edition:${MATTERMOST_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - db
    # Тоже используем именованные тома для данных приложения
    volumes:
      - app_config:/mattermost/config:rw
      - app_data:/mattermost/data:rw
      - app_logs:/mattermost/logs:rw
      - app_plugins:/mattermost/plugins:rw
      - app_client_plugins:/mattermost/client/plugins:rw
    environment:
      - MM_USERNAME=${POSTGRES_USER}
      - MM_PASSWORD=${POSTGRES_PASSWORD}
      - MM_DBNAME=${POSTGRES_DB}
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10
      
      # ГЛАВНОЕ ИСПРАВЛЕНИЕ ДЛЯ GITLAB SSO:
      # Указываем домен БЕЗ порта, если используем стандартные 80/443.
      # Если Timeweb пробросит порт иначе, добавьте :порт сюда.
      - MM_SERVICESETTINGS_SITEURL=https://${DOMAIN}
      
      # Включаем мобильные приложения
      - MM_SERVICESETTINGS_ENABLEMOBILEAPP=true
      - MM_SERVICESETTINGS_ENABLEMOBILEPUSHPROXY=true

  web:
    build: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # КРИТИЧНО: Пробрасываем стандартные порты. 
      # Timeweb ожидает, что контейнер слушает 80 и 443.
      - "80:80"
      - "443:443"
    volumes:
      # Сертификаты должны лежать в репозитории по этому пути
      - ./volumes/web/cert:/cert:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MATTERMOST_ENABLE_SSL=true
      # Передаем домен в nginx, если скрипт входа его использует (опционально)
      - DOMAIN=${DOMAIN}

# Объявляем именованные тома, чтобы Docker создал их сам
volumes:
  db_data:
  app_config:
  app_data:
  app_logs:
  app_plugins:
  app_client_plugins:
