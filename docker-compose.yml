services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    networks:
      - mattermost-net # Добавляем в сеть

  app:
    image: mattermost/mattermost-team-edition:${MATTERMOST_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - app_config:/mattermost/config:rw
      - app_data:/mattermost/data:rw
      - app_logs:/mattermost/logs:rw
      - app_plugins:/mattermost/plugins:rw
      - app_client_plugins:/mattermost/client/plugins:rw
    environment:
      - MM_USERNAME=${POSTGRES_USER}
      - MM_PASSWORD=${POSTGRES_PASSWORD}
      - MM_DBNAME=${POSTGRES_DB}
      # Убедитесь, что хост здесь точно 'db', как имя сервиса выше
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10
      
      - MM_SERVICESETTINGS_SITEURL=https://${DOMAIN}
      - MM_SERVICESETTINGS_ENABLEMOBILEAPP=true
      - MM_SERVICESETTINGS_ENABLEMOBILEPUSHPROXY=true
    networks:
      - mattermost-net # Добавляем в сеть

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "443"
      - "80"
    volumes:
      - cert_data:/cert:rw
    environment:
      - DOMAIN=${DOMAIN}
      - APP_HOST=app
      - APP_PORT_NUMBER=8065
    networks:
      - mattermost-net # Добавляем в сеть

volumes:
  db_data:
  app_config:
  app_data:
  app_logs:
  app_plugins:
  app_client_plugins:
  cert_data:

# Явное определение сети
networks:
  mattermost-net:
    driver: bridge
